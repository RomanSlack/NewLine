[package]
name = "nextline"
version = "0.1.0"
edition = "2021"
description = "A simple, GNOME-style task management app"
authors = ["Roman"]

[dependencies]
gtk = { package = "gtk4", version = "0.9" }
adw = { package = "libadwaita", version = "0.7" }
sourceview = { package = "sourceview5", version = "0.9" }
gio = "0.20"
glib = "0.20"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
open = "5"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
